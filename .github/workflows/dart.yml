name: Dart
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: 3.50.0
        channel: stable
        cache: true
    - name: Install dependencies
      run: flutter pub get
    - name: Verify published library formatting
      run: dart format --output=none --set-exit-if-changed lib
    - name: Analyze project source
      run: flutter analyze
    - name: Run package tests
      run: flutter test
    - name: Run example tests
      run: |
        cd example
        flutter pub get
        flutter test
    - name: Install package scoring tools
      run: |
        sudo apt-get update
        sudo apt-get install -y webp
        dart pub global activate pana 0.23.19
    - name: Verify full pub score
      run: dart pub global run pana --exit-code-threshold 0 .
    timeout-minutes: 20
permissions:
  contents: read
